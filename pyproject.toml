[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-linux-cli"
version = "0.1.0a1"
description = "Local access to your own WeCom client data on Linux"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.23,<4"]
license = "MIT"

[project.scripts]
wecom-linux = "wecom_linux_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

